<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline – Wizard PWA</title>
  <meta name="theme-color" content="#111" />
  <script>
    // Nur anzeigen, wenn wirklich offline: Falls jemand /offline.html
    // direkt aufruft während Online, sofort zurück zur App.
    try {
      if (navigator.onLine) {
        // replace vermeidet History-Eintrag
        location.replace('/');
      }
    } catch (_) { /* ignore */ }
  </script>
  <style>
    :root { color-scheme: dark light; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#111; color:#eee; display:grid; min-height:100vh; place-items:center; }
    .wrap { width:min(640px, 95vw); }
    h1 { font-size:1.1rem; margin:10px 0 6px; color:#ccc; }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .btn { background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:6px; padding:6px 10px; cursor:pointer; }
    .hint { font-size:.9rem; color:#aaa; }
    canvas { width:100%; height:auto; background:linear-gradient(#1b1b1b, #121212); border:1px solid #333; border-radius:8px; image-rendering:pixelated; }
    .note { margin-top:8px; color:#9aa; font-size:.9rem; }
  </style>
  <link rel="icon" href="/W_icon.png" />
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <h1>Offline – Dino Mini</h1>
      <div class="hint">Leertaste/Tippen = Springen</div>
      <button id="retry" class="btn">Neu</button>
    </div>
    <canvas id="game" width="640" height="200" aria-label="Dino Runner"></canvas>
    <div class="bar" style="margin-top:6px">
      <div>Score: <span id="score">0</span> · Best: <span id="best">0</span></div>
      <button id="reconnect" class="btn">Erneut verbinden</button>
    </div>
    <p class="note">Du bist offline. Einige Funktionen sind nicht verfügbar. Wenn die Verbindung wieder steht, lädt die App automatisch neu.</p>
  </div>

  <script src="/offline.js"></script>
</body>
</html>
