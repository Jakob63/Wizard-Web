@(implicit request: play.api.mvc.RequestHeader)

<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebSocket Game</title>
        <script src="https://unpkg.com/vue@@3"></script>
    </head>
