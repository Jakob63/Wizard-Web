@(implicit request: play.api.mvc.RequestHeader)

<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebSocket Game</title>
        <script src="https://unpkg.com/vue@@3"></script>
    </head>
    <body>
        <div id="home-vue-root" v-cloak>
            <h2 v-on:click="noop" v-bind:title="'Vue aktiv – klicke (keine Aktion)'">WebSocket Chat / Game</h2>
            <div id="app"></div>

            <div id="gameArea" style="margin-top:1rem;"></div>
            <button id="sendButton" v-on:click="noop">Send message</button>
        </div>

        <script src='@routes.Assets.versioned("javascripts/vueApp.js")'></script>
        <script src='@routes.Assets.versioned("javascripts/socketClient.js")'></script>
        <script>
            (function(){
                if (!window.Vue || typeof Vue.createApp !== 'function') return;
                try {
                    Vue.createApp({
                        methods: {
                            noop: function(){}
                        }
                    }).mount('#home-vue-root');
                } catch(e) { console.warn('Vue home app mount failed', e); }
            })();
        </script>
    </body>
</html>
