# https://www.playframework.com/documentation/latest/Configuration

pekko.http.server.idle-timeout = infinite
pekko.http.client.idle-timeout = infinite

# URL des Vite-Dev-Servers für SPA-Redirects im Dev-Modus
frontend.devUrl = "http://localhost:5173"

# CSRF configuration
# Exempt JSON API endpoints from CSRF validation. These endpoints are called via AJAX
# and we explicitly send the header "Csrf-Token: nocheck" from the frontend.
# This avoids Play rejecting requests if a stale/invalid query token is present.
play.filters.csrf.exempt-paths = [
  "/api/.*"
]

# For simplicity during development and to avoid proxy/header/query mismatches,
# disable the CSRF filter globally. Re-enable and harden in production as needed.
play.filters.disabled += "play.filters.csrf.CSRFFilter"

# In DEV only, fully disable CSRF filter to simplify SPA development via Vite proxy.
# This does not affect PROD unless you add a corresponding %prod section.
%dev.play.filters.disabled += "play.filters.csrf.CSRFFilter"